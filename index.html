<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RenoDX Discord Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <div class="header-row">
        <div>
          <h1>RenoDX <span class="accent">Discord</span> Tracker</h1>
          <p class="subtitle">Live member count and growth forecast</p>
        </div>
        <div class="live-badge"><span class="live-dot"></span><span>LIVE</span></div>
      </div>
    </header>

    <section class="stat-bar" id="stats">
      <div class="stat-segment">
        <span class="stat-label">Members</span>
        <span class="stat-value mono" id="stat-members">&mdash;</span>
      </div>
      <div class="stat-segment">
        <span class="stat-label">Online</span>
        <span class="stat-value mono" id="stat-online">&mdash;</span>
      </div>
      <div class="stat-segment">
        <span class="stat-label">Change</span>
        <span class="stat-value mono" id="stat-change">&mdash;</span>
      </div>
      <div class="stat-segment">
        <span class="stat-label">7-Day Forecast</span>
        <span class="stat-value mono" id="stat-forecast">&mdash;</span>
      </div>
    </section>

    <section class="chart-panel">
      <div class="chart-header">
        <h2>Member Count Over Time</h2>
        <span class="chart-badge">7-day forecast</span>
      </div>
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
      <p class="chart-note" id="chart-note"></p>
    </section>

    <section class="chart-panel">
      <div class="chart-header">
        <h2>Growth Per Interval</h2>
        <span class="chart-badge muted">Change between polls</span>
      </div>
      <div class="chart-wrap small"><canvas id="growthChart"></canvas></div>
    </section>

    <footer class="footer">
      <span>Data: <a href="https://discord.com/developers/docs/resources/invite" target="_blank" rel="noopener">Discord Invite API</a> (public, no bot)</span>
      <span class="sep">&middot;</span>
      <span>Polls every 10 min</span>
      <span class="sep">&middot;</span>
      <span id="last-updated">Loading&hellip;</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
