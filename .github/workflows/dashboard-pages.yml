name: dashboard-pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["discord-tracker"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
