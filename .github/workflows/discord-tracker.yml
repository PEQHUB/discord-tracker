name: discord-tracker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill N data points (15s intervals)"
        required: false
        type: boolean
        default: false
      count:
        description: "Number of backfill points"
        required: false
        type: number
        default: 20

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Discord invite data
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, datetime, urllib.request, time, os, sys

          BACKFILL = "${{ inputs.backfill }}" == "true"
          COUNT = int("${{ inputs.count }}" or "20") if BACKFILL else 1
          URL = "https://discord.com/api/v10/invites/F6AUTeWJHM"

          with open("dashboard/data/members.json") as f:
              history = json.load(f)

          fetched = 0
          for i in range(COUNT):
              if i > 0:
                  time.sleep(15)
              try:
                  req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0"})
                  resp = urllib.request.urlopen(req, timeout=10)
                  data = json.loads(resp.read())
                  profile = data["profile"]
                  entry = {
                      "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "memberCount": profile["member_count"],
                      "onlineCount": profile["online_count"]
                  }
                  history.append(entry)
                  fetched += 1
                  print(f"Point {i+1}/{COUNT}: {entry['memberCount']} members, {entry['onlineCount']} online")
              except Exception as e:
                  print(f"Point {i+1} failed: {e}", file=sys.stderr)
                  if not BACKFILL:
                      sys.exit(1)

          with open("dashboard/data/members.json", "w") as f:
              json.dump(history, f, indent=2)

          print(f"Total points: {len(history)}, fetched this run: {fetched}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/members.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update Discord member count"
          git push
