name: discord-tracker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Discord invite data
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import json, datetime, urllib.request, sys
          URL = "https://discord.com/api/v10/invites/F6AUTeWJHM"
          with open("dashboard/data/members.json") as f:
              history = json.load(f)
          req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0"})
          resp = urllib.request.urlopen(req, timeout=10)
          data = json.loads(resp.read())
          entry = {
              "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "memberCount": data["profile"]["member_count"],
              "onlineCount": data["profile"]["online_count"]
          }
          history.append(entry)
          with open("dashboard/data/members.json", "w") as f:
              json.dump(history, f, indent=2)
          print(f"Fetched: {entry['memberCount']} members, {entry['onlineCount']} online")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/members.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update Discord member count"
          git push

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages
          keep_files: false
