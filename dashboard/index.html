<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RenoDX Discord Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns-bundle.min.js"></script>
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <div class="header-row">
        <div>
          <h1>RenoDX <span class="accent">Discord</span> Tracker</h1>
          <p class="subtitle">Member count, rate of change, and 7-day forecast</p>
        </div>
        <div class="live-badge">
          <span class="live-dot"></span>
          <span class="live-text">LIVE</span>
        </div>
      </div>
    </header>

    <section class="stat-bar" id="stat-bar">
      <div class="stat-segment border-r">
        <span class="stat-label">MEMBERS</span>
        <span class="stat-value mono" id="stat-members">&mdash;</span>
      </div>
      <div class="stat-segment border-r">
        <span class="stat-label">ONLINE</span>
        <span class="stat-value mono" id="stat-online">&mdash;</span>
      </div>
      <div class="stat-segment border-r">
        <span class="stat-label">GROWTH / DAY</span>
        <span class="stat-value mono" id="stat-growth">&mdash;</span>
      </div>
      <div class="stat-segment border-r">
        <span class="stat-label">7-DAY FORECAST</span>
        <span class="stat-value mono" id="stat-forecast7">&mdash;</span>
      </div>
      <div class="stat-segment border-r">
        <span class="stat-label">30-DAY FORECAST</span>
        <span class="stat-value mono" id="stat-forecast30">&mdash;</span>
      </div>
      <div class="stat-segment">
        <span class="stat-label">R&sup2;</span>
        <span class="stat-value mono" id="stat-r2">&mdash;</span>
      </div>
    </section>

    <section class="chart-panel">
      <div class="chart-header">
        <h2>Member Count</h2>
        <span class="chart-badge green">7-Day Forecast</span>
      </div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#5865F2"></span> Actual</div>
        <div class="legend-item"><span class="legend-dot" style="background:#3fb950"></span> Forecast</div>
      </div>
      <div class="chart-body">
        <canvas id="mainChart"></canvas>
      </div>
    </section>

    <section class="chart-panel">
      <div class="chart-header">
        <h2>Daily Growth</h2>
        <span class="chart-badge">Rate of Change</span>
      </div>
      <div class="chart-body chart-body-sm">
        <canvas id="rateChart"></canvas>
      </div>
    </section>

    <footer class="footer">
      <span>Data from <a href="https://discord.com/developers/docs/resources/invite" target="_blank" rel="noopener">Discord Invite API</a></span>
      <span class="sep">&middot;</span>
      <span>Polls every 10 min</span>
      <span class="sep">&middot;</span>
      <span id="last-updated">Last updated: &mdash;</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
